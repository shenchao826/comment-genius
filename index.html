    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "评语助手 CommentGenius",
      "url": "https://teachers.minicode.cloud",
      "description": "AI驱动的智能教师评语生成工具，一键生成个性化、有温度的学生评语",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "CNY"
      },
      "author": {
        "@type": "Organization",
        "name": "CommentGenius Team"
      }
    }
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        .__loader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        .__loader-icon{font-size:48px;margin-bottom:12px}
        .__loader-text{font-size:18px;font-weight:600;color:#1e40af}
        .__loader-sub{font-size:14px;color:#64748b;margin-top:4px}
        @keyframes __pulse{0%,100%{opacity:.4}50%{opacity:.8}}
        .__loader-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3b82f6;margin:0 4px;animation:__pulse 1.2s ease-in-out infinite}
        .__loader-dot:nth-child(2){animation-delay:.2s}
        .__loader-dot:nth-child(3){animation-delay:.4s}
      </style>
      <div class="__loader">
        <div class="__loader-icon">🎓</div>
        <div class="__loader-text">评语助手</div>
        <div class="__loader-sub">AI赋能每一位教师</div>
        <div style="margin-top:16px"><span class="__loader-dot"></span><span class="__loader-dot"></span><span class="__loader-dot"></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
